<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Schloss (exakt in CSS)</title>
<style>

  body {
    background: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  /* logo mit Schloss */
  .text {
    font-family: Arial, sans-serif;
    display: flex;
    align-items: last baseline;
    justify-content:space-between;
    position: relative;
    width:fit-content;
    animation: test 2s 2s linear;
  }

  /*die einzelnen buchstaben*/
  .text span {
    width: 10vw;
    height: 10vw;
    flex-shrink: 1;
    background: #861ffc;
    font-size: 300%;
  }

  /* Animations test um zu gucken ob sich die buchtaben mit skalieren */
  @keyframes test {
    0% {
      width: fit-content;
    }
    1% {
      width: 40vw;
    }
    100% {
      width: 10px;
    }
  }

  .space {
    width: 6vw;
  }

  /* das schloss */
  .lock {
    flex-shrink: 0;
    position: relative;
    width: 8vw;
    aspect-ratio: 1 / 1.5;
    display: flex;
    flex-direction:column;
    align-items: center;
  }

  /* Bügel */
  .shackle {
    position: relative;
    width: 80%;
    height: 40%;
    border-radius: 50% 50% 0 0;
    background-color: #000;
    transform-origin: 70% 100%;
    animation: openShackle 1s 0s linear;
  }

  .shackle::after {
    content: "";
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    margin-top: 20%;
    margin-bottom: -1%;
    top: 0;
    bottom: 0;
    width: 60%;
    border-radius:50% 50% 0 0;
    background: #ffffff;
  }

  /* Bügel Animation zum öffnen des geschlossenen Bügels */
  @keyframes openShackle {
    0% {
      transform: rotate(22.5deg);
    }
    95% {
      transform: rotate(22.5deg);
    }
    100% {
      transform: rotate(0deg);
    }
  }

  /* Geöffneter Bügel (für statisches Bild) */
  .shackle_open {
    position: relative;
    bottom: 0;
    width: 80%;
    height: 40%;
    transform-origin: 80% 100%;
    transform:rotate(22.5deg);
    border-radius: 50% 50% 0 0;
    background-color: #000;
    animation: closeShackle 0.05s 2s linear forwards;
  }

  .shackle_open::after {
    content: "";
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    margin-top: 20%;
    margin-bottom: -2%;
    top: 0;
    bottom: 0;
    width: 60%;
    border-radius:50% 50% 0 0;
    background: #ffffff;
  }

  /* Bügel Animation zum schließen des geöffneten bügels */
  @keyframes closeShackle {
    0% {
      transform: rotate(22.5deg);
    }
    100% {
      transform: rotate(0deg);
    }
  }

  /* Schlosskörper */
  .body {
    position: relative;
    width: 100%;
    height: 60%;
    background: #000;
    border-radius: 12% 12% 30% 30%;
  }

  /* Schlüsselloch */
  .keyhole {
    position: absolute;
    bottom: 42%;
    left: 50%;
    transform: translateX(-50%);
    width: 30%;
    aspect-ratio: 1 / 1;
    background: #fff;
    border-radius: 50%;
  }

  .keyhole::before {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -40%;
    transform:translateX(-50%);
    width: 100%;
    height: 100%;
    background: #ffffff;
    clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%);
  }
</style>

</head>
<body>

  <!-- Logo mit Schloss in CSS -->
  <div class="text">
    <span>B</span>
    <span>r</span>
    <span>e</span>
    <div class="lock">
      <div class="shackle"></div>
      <div class="body">
        <div class="keyhole"></div>
      </div>
    </div>
    <span>k</span>
    <span class="space"></span>
    <span>o</span>
    <span>u</span>
    <span>t</span>
  </div>

  <!-- Statisches Bild des Schlosses mit geöffnetem Bügel (erster test)-->

  <!--<div class="lock">
    <div class="shackle_open"></div>
    <div class="body">
      <div class="keyhole"></div>
    </div>
  </div>-->

</body>
</html>
