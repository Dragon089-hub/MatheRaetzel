<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Benutzernamen prüfen</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="input-section">
      <input type="text" id="username" placeholder="Benutzernamen eingeben...">
    </div>

    <div class="info-section">
      <p>Klicke auf das Schloss, um deinen Namen zu bestätigen</p>
    </div>

    <div class="lock-section">
      <div id="lock" class="lock open"></div>
    </div>
  </div>

  <script>
    const lock = document.getElementById("lock");
    const input = document.getElementById("username");

    lock.addEventListener("click", () => {
      const username = input.value.trim();
      if (!username) {
        alert("Bitte zuerst einen Benutzernamen eingeben!");
        return;
      }

      // Beispielhafte Prüfung
      const verfügbar = username.toLowerCase() !== "admin" && username.length >= 3;

      lock.classList.remove("available", "unavailable","closed","open");

      if (verfügbar) {
        lock.classList.add("open", "available");
      } else {
        lock.classList.add("closed", "unavailable");
      }
    });
  </script>
</body>
</html>
