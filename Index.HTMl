<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Lock</title>
  <link rel="stylesheet" href="style.css">
  
</head>
<body>

  <!-- ================= STARTSEITE ================= -->
  <div class="startpage">
    <h1>Bre<span>a</span>k out</h1>
    <p>Gib deinen Benutzernamen ein und bestätige mit dem Schloss</p>

    <!-- Eingabefeld -->
    <input type="text" id="username" placeholder="Benutzernamen eingeben...">

    <!-- Schloss -->
    <div class="lock-container">
      <div class="lock" id="lock">
        <div class="shackle"></div>
        <div class="body"></div>
      </div>
      <p>Klicke zweimal auf das Schloss</p>
    </div>
  </div>

  <!-- ================= LOCKED SCREEN ================= -->
  <div class="locked-screen" id="lockedScreen">
    <div class="fall-text" id="fallText">
      <span>L</span>
      <span>O</span>
      <span>C</span>
      <span>K</span>
      <span>E</span>
      <span>D</span>
    </div>

    <!-- Zahlenschloss -->
    <div class="number-lock" id="numberLock">
      <div class="number-dial" data-value="0">0</div>
      <div class="number-dial" data-value="0">0</div>
      <div class="number-dial" data-value="0">0</div>
      <div class="number-dial" data-value="0">0</div>
    </div>
  </div>

  <!-- Overlay für Buchstabenaktionen -->
  <div class="overlay" id="overlay">
    <button id="closeOverlay">X</button>
    <div class="overlay-content" id="overlayContent"></div>
  </div>
<script src="script.js"></script>
</body>
</html>
